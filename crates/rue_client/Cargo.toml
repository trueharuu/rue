[package]
name = "rue_client"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
async-trait = "0.1"
dotenvy = "0.15.7"
futures = "0.3.32"
rue_core = { version = "0.1.0", path = "../rue_core" }
rue_eval = { version = "0.1.0", path = "../rue_eval" }
rue_macro = { version = "0.1.0", path = "../rue_macro" }
rue_nav = { version = "0.1.0", path = "../rue_nav" }
rue_search = { version = "0.1.0", path = "../rue_search" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
triangle = { git = "https://github.com/halp1/triangle-rs", package = "triangle-rs" }

[lints]
workspace = true
